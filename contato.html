<h1>Abra um caso</h1>
<div class="dados"><p>Rua dos Arquivos, 42 &mdash; Centro, Belo Horizonte/MG</p><p>Telefone: (31) 3000-0000</p></div>
<form id="form-contato" novalidate>
<div><label for="nome">Nome</label><input type="text" id="nome" name="nome"><div class="erro" id="erro-nome"></div></div>
<div><label for="email">E-mail</label><input type="email" id="email" name="email"><div class="erro" id="erro-email"></div></div>
<div><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem"></textarea><div class="erro" id="erro-mensagem"></div></div>
<button class="botao" type="submit">Enviar pedido</button>
<p class="sucesso" id="retorno" role="status"></p>
</form>
